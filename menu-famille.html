function pickL(ds,used){const[a,b,c]=ds.split('-').map(Number),sh=shift(new Date(a,b-1,c)),all=D(),R_=all.filter(x=>x.t.includes('R')).map(x=>x.id),P_=all.filter(x=>x.t.includes('Q')&&!x.t.includes('R')&&!x.t.includes('L')).map(x=>x.id),RS=all.filter(x=>x.n=='Restes de la veille').map(x=>x.id);let pool;
